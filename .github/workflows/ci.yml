name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: make setup
      - run: make check
